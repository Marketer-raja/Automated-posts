name: Instagram Automation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Choose sample design, fresh preview, or live Instagram publish
        type: choice
        required: true
        default: sample
        options: [sample, preview, publish]

permissions:
  contents: write

concurrency:
  group: marketer-raja-instagram
  cancel-in-progress: false

jobs:
  carousel:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Generate carousel
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.AUTO_PUBLISH == 'true' && 'publish' || 'preview') }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: python publish.py --mode "$MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-carousel-${{ github.run_id }}-${{ github.run_attempt }}
          path: instagram-output/
          if-no-files-found: ignore
          retention-days: 1
